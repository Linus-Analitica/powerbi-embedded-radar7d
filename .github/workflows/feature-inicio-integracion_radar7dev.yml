name: Build and deploy ASP.Net Core app to Azure Web App - radar7d-testing

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BUILD_DEFINITION_NAME: BackOfficeDEVL # cámbialo según la rama
      APPSETTINGS_DEVELOP_JSON: ${{ vars.DEVL_JSON }}

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0"

      - name: Crear appsettings.json desde variable segura
        run: |
          cat > appsettings.json <<EOF
          ${APPSETTINGS_DEVELOP_JSON}
          EOF

      - name: Verificar appsettings.json
        run: |
          cat ./appsettings.json | jq empty

      - name: Build con dotnet
        run: dotnet build --configuration Release

      - name: Publicar proyecto
        run: dotnet publish -c Release -o ${{ env.DOTNET_ROOT }}/myapp /p:Build_DefinitionName=${{ env.BUILD_DEFINITION_NAME }}

      - name: Subir artefacto para despliegue
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{ env.DOTNET_ROOT }}/myapp

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: "Production"
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Descargar artefacto
        uses: actions/download-artifact@v4
        with:
          name: .net-app

      - name: Login a Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_307C5421357A429B8DF9C6C19E3EA3C2 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_B391EECB9E384AD49F804891AE75F921 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_DA6D1A58581D4DBFB97C9710B5BB4905 }}

      - name: Desplegar a Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: "radar7d-testing"
          slot-name: "Production"
          package: .
