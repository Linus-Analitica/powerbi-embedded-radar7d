# Docs: https://github.com/Azure/webapps-deploy
name: Build and deploy ASP.Net Core app to Azure Web App - radar7d-testing

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  update-settings:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show current files
        run: ls -R

      - name: Mostrar contenido actual (si existe)
        run: cat appsettings.json || echo "⚠️ No existe aún"

      - name: Crear appsettings.json desde variable
        run: echo "${{ vars.DEVL_JSON }}" > appsettings.json

      - name: Mostrar appsettings.json nuevo
        run: cat appsettings.json

      - name: Validar formato JSON
        run: cat appsettings.json | jq empty

  build:
    runs-on: ubuntu-latest
    needs: update-settings

    env:
      Build_DefinitionName: "BackOfficePPRD"

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Descargar settings desde variable
        run: echo "${{ vars.DEVL_JSON }}" > appsettings.json

      - name: Validar nuevamente el JSON
        run: cat appsettings.json | jq empty

      - name: Build del proyecto
        run: dotnet build --configuration Release /p:Build_DefinitionName=${{ env.Build_DefinitionName }}

      - name: Publicar build
        run: dotnet publish -c Release -o ./publish /p:Build_DefinitionName=${{ env.Build_DefinitionName }}

      - name: Copiar appsettings.json al directorio publicado
        run: cp appsettings.json ./publish/

      - name: Verificar contenido final a subir
        run: |
          ls -lh ./publish
          cat ./publish/appsettings.json

      - name: Subir artefacto para despliegue
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ./publish

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: "Production"
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
      - name: Descargar artefacto publicado
        uses: actions/download-artifact@v4
        with:
          name: .net-app
          path: ./app

      - name: Verificar artefacto descargado
        run: |
          ls -lh ./app
          cat ./app/appsettings.json || echo "⚠️ Faltante"

      - name: Login a Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_307C5421357A429B8DF9C6C19E3EA3C2 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_B391EECB9E384AD49F804891AE75F921 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_DA6D1A58581D4DBFB97C9710B5BB4905 }}

      - name: Desplegar en Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: "radar7d-testing"
          slot-name: "Production"
          package: ./app
